<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenClaw Portable Logo — Manga Edition -->
  <rect width="100" height="100" rx="16" fill="#0F172A"/>
  <g>
    <!-- Head -->
    <ellipse cx="50" cy="46" rx="24" ry="26" fill="white"/>
    <!-- Ears -->
    <path d="M28 32 L20 14 L38 26" fill="white"/>
    <path d="M72 32 L80 14 L62 26" fill="white"/>
    <!-- Ear inner -->
    <path d="M30 28 L24 18 L36 26" fill="#3B82F6"/>
    <path d="M70 28 L76 18 L64 26" fill="#3B82F6"/>
    <!-- Left eye -->
    <ellipse cx="40" cy="42" rx="6" ry="7" fill="#1E293B"/>
    <circle cx="41" cy="41" r="3.5" fill="white"/>
    <circle cx="42" cy="40" r="1.5" fill="#3B82F6"/>
    <circle cx="39" cy="43" r="0.6" fill="#0F172A"/>
    <!-- Right eye -->
    <ellipse cx="60" cy="42" rx="6" ry="7" fill="#1E293B"/>
    <circle cx="59" cy="41" r="3.5" fill="white"/>
    <circle cx="60" cy="40" r="1.5" fill="#3B82F6"/>
    <circle cx="57" cy="43" r="0.6" fill="#0F172A"/>
    <!-- Eyebrows -->
    <path d="M32 34 Q40 30 48 34" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M52 34 Q60 30 68 34" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M43 58 Q50 63 57 58" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <ellipse cx="34" cy="54" rx="4" ry="2.5" fill="#3B82F6" opacity="0.15"/>
    <ellipse cx="66" cy="54" rx="4" ry="2.5" fill="#3B82F6" opacity="0.15"/>
    <!-- Head shine -->
    <ellipse cx="56" cy="34" rx="6" ry="10" fill="#000" opacity="0.06"/>
  </g>
</svg>
