<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    OpenClaw Portable Logo — Manga Edition
    Dark background version (white/light on dark)
    Claw character with USB pendant
  -->
  <rect width="100" height="100" rx="16" fill="#0F172A"/>
  
  <g fill="white">
    <!-- ═══ Head Shape (rounded, cute manga style) ═══ -->
    <ellipse cx="50" cy="46" rx="24" ry="26"/>
    
    <!-- ═══ Ears (pointed, cat-like but techy) ═══ -->
    <path d="M 28 32 L 20 14 L 38 26" fill="#1E293B"/>
    <path d="M 72 32 L 80 14 L 62 26" fill="#1E293B"/>
    <!-- Ear inner -->
    <path d="M 30 28 L 24 18 L 36 26" fill="#3B82F6"/>
    <path d="M 70 28 L 76 18 L 64 26" fill="#3B82F6"/>
    
    <!-- ═══ Eyes (large manga style) ═══ -->
    <!-- Left eye -->
    <ellipse cx="40" cy="42" rx="6" ry="7" fill="#1E293B"/>
    <circle cx="41" cy="41" r="3.5" fill="white"/>
    <circle cx="42" cy="40" r="1.3" fill="#3B82F6"/>
    <circle cx="39" cy="43" r="0.6" fill="black" opacity="0.5"/>
    <!-- Right eye -->
    <ellipse cx="60" cy="42" rx="6" ry="7" fill="#1E293B"/>
    <circle cx="59" cy="41" r="3.5" fill="white"/>
    <circle cx="60" cy="40" r="1.3" fill="#3B82F6"/>
    <circle cx="57" cy="43" r="0.6" fill="black" opacity="0.5"/>
    
    <!-- Eyebrows -->
    <path d="M 32 34 Q 40 30, 48 34" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 52 34 Q 60 30, 68 34" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Nose -->
    <path d="M 50 48 L 48 53" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Mouth (small cat-like smile) -->
    <path d="M 43 58 Q 50 63, 57 58" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Cheek highlights -->
    <ellipse cx="34" cy="54" rx="4" ry="2.5" fill="#3B82F6" opacity="0.2"/>
    <ellipse cx="66" cy="54" rx="4" ry="2.5" fill="#3B82F6" opacity="0.2"/>
    
    <!-- Head shine -->
    <ellipse cx="56" cy="34" rx="6" ry="10" fill="black" opacity="0.08"/>
    
    <!-- ═══ Claws (arms reaching down) ═══ -->
    <path d="M 28 62 Q 22 72, 26 80 L 24 86" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 72 62 Q 78 72, 74 80 L 76 86" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    
    <!-- ═══ USB Pendant (held by one claw) ═══ -->
    <line x1="72" y1="80" x2="76" y2="84" stroke="white" stroke-width="2"/>
    <rect x="72" y="84" width="8" height="10" rx="1.5" fill="#3B82F6"/>
    <rect x="74" y="78" width="4" height="8" rx="1"/>
    <!-- USB port detail -->
    <rect x="74" y="86" width="4" height="3" rx="0.5" fill="#0F172A"/>
  </g>
</svg>
