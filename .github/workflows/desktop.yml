name: Build Desktop

# Builds OpenClaw Desktop (Electron) installers for macOS, Windows, and
# Linux on every `v*` tag, and uploads them as additional assets to the
# same GitHub Release that build.yml created. Manual dispatch is also
# supported for testing.

on:
  # NOTE: tag trigger disabled — we pivoted to the .app/.vbs shim
  # approach (data stays on USB stick). This Electron build is on hold
  # and only runs on manual dispatch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install OpenClaw core into app/core/node_modules so electron-builder
      # picks it up via extraResources. We use --ignore-scripts to skip
      # the postinstall step that downloads platform-specific Node binaries
      # (we don't need those — Electron has its own Node).
      - name: Install OpenClaw core
        shell: bash
        run: |
          cd app/core
          npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Install desktop dependencies
        shell: bash
        run: |
          cd desktop
          npm install --no-audit --no-fund

      # On tag push: build + publish to the existing GitHub Release.
      # On manual dispatch / push: build only, upload as workflow artifact.
      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            npx electron-builder --${{ matrix.platform }} --publish always
          else
            npx electron-builder --${{ matrix.platform }} --publish never
          fi

      - name: Upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-desktop-${{ matrix.platform }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest*.yml
          if-no-files-found: warn
          retention-days: 14
