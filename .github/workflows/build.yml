name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Single job builds the universal zip containing ALL platform runtimes.
    # node_modules is pure JS (cross-platform), only the Node.js binary
    # differs per OS/arch. setup.sh --all-platforms downloads all of them.
    # We run on macOS (has tar + unzip + curl) which can fetch all platforms.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build universal package (all platforms)
        run: bash setup.sh --all-platforms

      - name: Verify runtimes
        run: |
          set -e
          echo "Checking all platform runtimes..."
          test -f app/runtime/node-mac-arm64/bin/node   || { echo "MISSING: node-mac-arm64"; exit 1; }
          test -f app/runtime/node-mac-x64/bin/node     || { echo "MISSING: node-mac-x64"; exit 1; }
          test -f app/runtime/node-linux-x64/bin/node   || { echo "MISSING: node-linux-x64"; exit 1; }
          test -f app/runtime/node-win-x64/node.exe     || { echo "MISSING: node-win-x64"; exit 1; }
          test -f app/runtime/node-linux-arm64/bin/node || { echo "MISSING: node-linux-arm64"; exit 1; }
          test -f app/core/node_modules/openclaw/openclaw.mjs || { echo "MISSING: openclaw.mjs"; exit 1; }
          echo "All runtimes present:"
          ls -d app/runtime/*/
          echo "OpenClaw installed OK"

      - name: Lift app shells to zip root
        run: |
          set -e
          # The repo keeps installers/ as a source directory so the
          # commits stay tidy. For end users, OpenClaw.app, OpenClaw.vbs,
          # OpenClaw.desktop, openclaw.png need to sit at the portable
          # root (next to Mac-Start.command etc.) so double-click works.
          if [ -d installers/OpenClaw.app ]; then
            cp -R installers/OpenClaw.app ./OpenClaw.app
          fi
          [ -f installers/OpenClaw.vbs ] && cp installers/OpenClaw.vbs ./OpenClaw.vbs || true
          [ -f installers/OpenClaw.desktop ] && cp installers/OpenClaw.desktop ./OpenClaw.desktop || true
          [ -f installers/openclaw.png ] && cp installers/openclaw.png ./openclaw.png || true
          # Source dir not needed in user zip
          rm -rf installers
          # Restore exec bit on the .app launcher binary (cp preserved it
          # but defensive belt-and-suspenders).
          [ -f OpenClaw.app/Contents/MacOS/OpenClaw ] && chmod +x OpenClaw.app/Contents/MacOS/OpenClaw || true

      - name: Prepare portable folder
        run: |
          set -e
          # Remove dev/build artifacts that users don't need. The zip
          # should contain ONLY what the launchers need to run directly
          # on any supported platform. setup.* scripts and CI config
          # are kept in the repo (for rebuilding) but stripped from the
          # user-facing zip.
          rm -rf .git .github .gitignore desktop
          # Build-only tooling: users don't rebuild from the zip —
          # they run the launcher directly. setup.* would only confuse
          # them, and Install scripts violate the zero-trace promise by
          # copying to ~/.openclaw-portable/.
          rm -f setup.sh setup.bat setup.ps1
          # skills-cn has already been copied into app/core/node_modules/
          # openclaw/skills/ by setup. Keeping the source dir wastes
          # ~1 MB and duplicates skills in two places.
          rm -rf skills-cn
          echo "Portable folder ready for end users"
          du -sh .
          du -sh app/runtime/*/

      - name: Restore exec bits
        run: |
          # upload-artifact loses exec bits; set them before zipping
          chmod +x Mac-Start.command Mac-Menu.command Mac-Diagnose.command
          chmod +x Linux-Start.sh Linux-Diagnose.sh lib/maintain.sh
          for bindir in app/runtime/node-mac-*/bin app/runtime/node-linux-*/bin; do
            [ -d "$bindir" ] && find "$bindir" -type f -exec chmod +x {} +
          done

      - name: Create zip
        run: |
          set -e
          # We're currently cwd=$GITHUB_WORKSPACE; the dir name depends
          # on the repo name casing (Openclaw-portable) and isn't stable
          # across forks. Copy the tree into a fresh sibling dir named
          # OpenClawPortable/ (the name we want users to see after
          # unzip) and zip from there.
          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          STAGE="$WORK_PARENT/OpenClawPortable"
          rm -rf "$STAGE"
          # -a preserves exec bits set in the previous step
          cp -a "$GITHUB_WORKSPACE"/. "$STAGE"/
          # Don't ship the .git we removed earlier back via cp -a if
          # someone re-adds it; defensive remove inside the stage dir.
          rm -rf "$STAGE/.git" "$STAGE/.github"
          cd "$WORK_PARENT"
          zip -yrq OpenClawPortable.zip OpenClawPortable/
          mv OpenClawPortable.zip "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/OpenClawPortable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawPortable
          path: OpenClawPortable.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenClawPortable
          path: .

      - name: Show artifact
        run: ls -lh OpenClawPortable.zip

      - name: Compose release notes
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          {
            echo "## OpenClaw Portable $TAG"
            echo
            echo "便携版 AI 助手，解压即用，零安装，跨平台。"
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| [OpenClawPortable.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/OpenClawPortable.zip) | 全平台通用包 (macOS arm64/x64 + Linux x64/arm64 + Windows x64) |"
            echo
            echo "### 启动方式"
            echo
            echo "| 平台 | 操作 |"
            echo "|---|---|"
            echo "| macOS | 双击 \`Mac-Start.command\` |"
            echo "| Windows | 双击 \`Windows-Start.bat\` |"
            echo "| Linux | \`bash Linux-Start.sh\` |"
            echo
            echo "### 首次使用"
            echo
            echo "1. 解压到 U 盘或任意目录"
            echo "2. 双击启动器"
            echo "3. 浏览器打开配置中心 → 选模型 → 填 Key → 保存 → 打开聊天"
            echo
            echo "### macOS 权限问题"
            echo
            echo "首次双击如果提示无法打开："
            echo
            echo "\`\`\`bash"
            echo "cd ~/Downloads/OpenClawPortable"
            echo "xattr -cr . && chmod +x Mac-Start.command"
            echo "\`\`\`"
            echo
            echo "### SHA-256"
            echo
            echo "\`\`\`"
            sha256sum OpenClawPortable.zip 2>/dev/null || shasum -a 256 OpenClawPortable.zip
            echo "\`\`\`"
            echo
            echo "---"
            echo
            echo "基于 [OpenClaw](https://github.com/nicepkg/openclaw) · MIT License"
          } > release-notes.md
          cat release-notes.md

      - name: Determine pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qE "(alpha|beta|rc)"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cleanup duplicate drafts for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          echo "Looking for draft releases on tag: $TAG_NAME"
          DRAFT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG_NAME\") | .id")
          if [ -z "$DRAFT_IDS" ]; then
            echo "No duplicate drafts found."
          else
            for rid in $DRAFT_IDS; do
              echo "Deleting draft release id=$rid"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$rid"
            done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenClawPortable.zip
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          fail_on_unmatched_files: false
