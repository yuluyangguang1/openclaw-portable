name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Single job builds the universal zip containing ALL platform runtimes.
    # node_modules is pure JS (cross-platform), only the Node.js binary
    # differs per OS/arch. setup.sh --all-platforms downloads all of them.
    # We run on macOS (has tar + unzip + curl) which can fetch all platforms.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build universal package (all platforms)
        env:
          # npmmirror (the default in setup.*) syncs upstream npm releases
          # with multi-hour gaps — @openclaw/* 2026.9.2 was missing for 22h+
          # and broke the beta.5 build with npm ETARGET. CI runners are
          # overseas: use the official registry, keep the mirror default
          # for end users only.
          NPM_REGISTRY: https://registry.npmjs.org
        run: bash setup.sh --all-platforms

      - name: Verify runtimes
        run: |
          set -e
          echo "Checking all platform runtimes..."
          test -f app/runtime/node-mac-arm64/bin/node   || { echo "MISSING: node-mac-arm64"; exit 1; }
          test -f app/runtime/node-mac-x64/bin/node     || { echo "MISSING: node-mac-x64"; exit 1; }
          test -f app/runtime/node-linux-x64/bin/node   || { echo "MISSING: node-linux-x64"; exit 1; }
          test -f app/runtime/node-win-x64/node.exe     || { echo "MISSING: node-win-x64"; exit 1; }
          test -f app/runtime/node-linux-arm64/bin/node || { echo "MISSING: node-linux-arm64"; exit 1; }
          test -f app/core/node_modules/openclaw/openclaw.mjs || { echo "MISSING: openclaw.mjs"; exit 1; }
          test -f app/core/node_modules/@tencent-weixin/openclaw-weixin/openclaw.plugin.json || { echo "MISSING: WeChat plugin manifest"; exit 1; }
          test -f app/core/node_modules/@tencent-weixin/openclaw-weixin/dist/index.js || { echo "MISSING: WeChat plugin dist/index.js"; exit 1; }
          echo "All runtimes present:"
          ls -d app/runtime/*/
          echo "OpenClaw installed OK"
          echo "WeChat plugin installed OK"

      - name: Patch plugin permission check for exFAT/FAT32 USB sticks
        run: |
          # OpenClaw's plugin discovery blocks directories with mode=777
          # (world-writable) as a security measure. But exFAT/FAT32 USB
          # sticks don't support Unix permissions — macOS/Linux report
          # every file as 777. This causes ALL bundled plugins to be
          # blocked on USB deployments (the primary use case for this
          # portable distribution).
          #
          # The upstream has no env-var escape hatch, so we patch the
          # bundled discovery module to respect our own env var:
          # OPENCLAW_SKIP_PLUGIN_PERMISSION_CHECK=1 (set by all launchers).
          #
          # 2026.9.4 status: the `path_world_writable` check is BACK
          # upstream (present in discovery-*.mjs and worker/worker.mjs of
          # the 9.4 dist), so this step patches it again on every build —
          # exactly the "future release reintroduces the check" case this
          # dynamic grep was kept for. system/patch-exfat-identity.js form
          # M additionally covers the worker/ copy (hit-rate precheck
          # against the pristine 9.4 tgz: 16 files, all forms matched).
          # 2026.9.3 had it removed (soft-skip); 2026.9.2 and earlier
          # always needed this patch.
          #
          # The patch clears the world-writable bit from the mode check
          # when the env var is set, making the check pass. On NTFS/APFS
          # (where permissions work correctly) the env var is still set
          # but has no effect because mode is never 777 in the first place.
          DISCOVERY="app/core/node_modules/openclaw/dist/discovery-BEbYTYvv.js"
          if [ ! -f "$DISCOVERY" ]; then
            # Filename may change across OpenClaw versions; find it dynamically
            DISCOVERY=$(grep -rl "path_world_writable" app/core/node_modules/openclaw/dist/ --include="*.js" | grep -i discovery | head -1)
          fi
          if [ -z "$DISCOVERY" ] || [ ! -f "$DISCOVERY" ]; then
            echo "WARNING: Could not find discovery module to patch. Plugin permission issue may persist on exFAT."
            exit 0
          fi
          echo "Patching: $DISCOVERY"
          sed -i '' 's/let modeBits = stat\.mode & 511;/let modeBits = stat.mode \& 511; if (process.env.OPENCLAW_SKIP_PLUGIN_PERMISSION_CHECK) modeBits = modeBits \& ~2;/' "$DISCOVERY"
          # Verify the patch landed
          if grep -q "OPENCLAW_SKIP_PLUGIN_PERMISSION_CHECK" "$DISCOVERY"; then
            echo "OK: exFAT plugin permission patch applied"
          else
            echo "WARNING: Patch did not apply cleanly"
          fi

      - name: Patch openclaw dist for slow disks (identity, worker timeouts, plugin skills)
        run: |
          set -e
          # Two field-tested fixes ship via system/patch-exfat-identity.js:
          # 1) @openclaw/fs-safe 0.8.5 verifies file identity via stat
          #    dev/ino (bigint) and requires ino != 0n on win32. exFAT/FAT32
          #    report a zero file index → "FsSafeError: file identity
          #    changed or could not be verified" on first boot from a USB
          #    stick (beta.7/beta.8 field reports). Neutralised for the
          #    ino===0n case only, so NTFS/APFS behaviour is unchanged.
          # 2) Control UI "connect verified AI models" detection runs in a
          #    Worker thread that does NOT share the main thread's ESM
          #    module cache and reloads the whole dist graph from disk.
          #    On slow disks (exFAT USB) that alone takes ~67s cold and a
          #    full detection still needs ~54s warm → the hardcoded 30s
          #    SETUP_INFERENCE_DETECTION_TIMEOUT_MS always fires
          #    (SetupInferenceDetectionTimeoutError, beta.9 field report).
          #    Bumped to 180s; verified ~76s end-to-end success on the
          #    affected machine.
          # 3) exFAT volumes support no reparse points at all: symlink
          #    AND junction creation both fail with EISDIR (probe-
          #    reproduced). publishPluginSkills therefore fails for every
          #    plugin skill, hiding browser-automation/canvas skills from
          #    the agent SDK. Patched to fall back to a recursive copy —
          #    upstream already treats win32 real directories in
          #    plugin-skills/ as managed entries (safe cleanup).
          # 4) models.list runs through the prepared-model-catalog Worker
          #    (same cold-reload cost); under concurrent setup.detect
          #    workers on exFAT it exceeded the 180s budget once
          #    (WorkerTaskError: worker task timed out). Bumped to 300s.
          # 5) The Control UI bundle caps each openclaw.setup.detect
          #    request at 40s client-side — on slow disks the server
          #    Worker finishes within 180s but the UI already gave up
          #    ("gateway request timed out after 40000ms"). Bumped to
          #    200s in model-setup-page-*.js (no-op on fast disks).
          # 6) Three POSIX permission gates are explicitly skipped on
          #    win32 but not on Linux/macOS, and exFAT/FAT silently
          #    ignores chmod, so a mac (or Linux) user running the same
          #    USB stick hits, in order: "directory final mode could not
          #    be verified" (gateway will not start), "coordinator
          #    directory permissions are not private" (same), and
          #    path_world_writable, which drops every plugin candidate
          #    (measured: 0 plugins, no error in the gateway log).
          #    macOS mounts exFAT noowners/0777 and mount_exfat has no
          #    umask option, so there is no mount-side workaround.
          #    All three now tolerate the mismatch only when chmod
          #    provably did not move the mode; on ext4/APFS chmod works,
          #    so the checks behave exactly as before (verified on a real
          #    exFAT volume: 13 plugins, same as ext4).
          node system/patch-exfat-identity.js

      - name: Lift app shells to zip root
        run: |
          set -e
          # The repo keeps installers/ as a source directory so the
          # commits stay tidy. For end users, OpenClaw.app and OpenClaw.vbs
          # go to root (next to system/) so double-click works.
          if [ -d installers/OpenClaw.app ]; then
            cp -R installers/OpenClaw.app ./OpenClaw.app
          fi
          [ -f installers/OpenClaw.vbs ] && cp installers/OpenClaw.vbs ./OpenClaw.vbs || true
          # Linux .desktop goes into system/ (Linux users are comfortable
          # navigating subdirectories; keeps root minimal for casual users)
          [ -f installers/OpenClaw.desktop ] && cp installers/OpenClaw.desktop ./OpenClaw.desktop || true
          # Source dir not needed in user zip
          rm -rf installers
          # Restore exec bit on the .app launcher binary (cp preserved it
          # but defensive belt-and-suspenders).
          [ -f OpenClaw.app/Contents/MacOS/OpenClaw ] && chmod +x OpenClaw.app/Contents/MacOS/OpenClaw || true

      - name: Prepare portable folder
        run: |
          set -e
          # Remove dev/build artifacts that users don't need. The zip
          # should contain ONLY what the launchers need to run directly
          # on any supported platform. setup.* scripts and CI config
          # are kept in the repo (for rebuilding) but stripped from the
          # user-facing zip.
          rm -rf .git .github .gitignore
          # Build-only tooling: users don't rebuild from the zip —
          # they run the launcher directly. setup.* would only confuse
          # them, and Install scripts violate the zero-trace promise by
          # copying to ~/.openclaw-portable/.
          rm -f setup.sh setup.bat setup.ps1
          # skills-cn has already been copied into app/core/node_modules/
          # openclaw/skills/ by setup. Keeping the source dir wastes
          # ~1 MB and duplicates skills in two places.
          rm -rf skills-cn
          echo "Portable folder ready for end users"
          du -sh .
          du -sh app/runtime/*/

      - name: Enforce GBK + CRLF (no BOM) on .bat files
        run: |
          # cmd.exe on CN Windows parses .bat source as CP936 (system
          # ANSI). UTF-8 Chinese bytes misalign cmd's DBCS byte
          # accounting -> leading chars of following lines get
          # swallowed ("et" for "set") and block parsing corrupts.
          # chcp 65001 does NOT fix this reliably (verified on real
          # machines); a UTF-8 BOM only breaks the first line. The
          # only parse-safe encoding for Chinese .bat is GBK + CRLF
          # + no BOM (report §二十五). Repo files are already GBK;
          # this step is a safety net that converts any UTF-8 strays
          # and normalizes EOL.
          python3 - <<'PY'
          import glob
          changed = []
          for p in sorted(glob.glob("*.bat")):
              data = open(p, "rb").read()
              try:
                  data.decode("ascii")
                  continue  # pure ASCII, skip
              except UnicodeDecodeError:
                  pass
              try:
                  # UTF-8 source (BOM optional) -> convert to GBK
                  text = data.decode("utf-8-sig")
              except UnicodeDecodeError:
                  # already GBK -> re-decode as GBK
                  text = data.decode("gbk")
              text = text.replace("\r\n", "\n").replace("\r", "\n").replace("\n", "\r\n")
              out = text.encode("gbk")
              if out != data:
                  open(p, "wb").write(out)
                  changed.append(p)
          for p in changed:
              print(f"Normalized to GBK+CRLF: {p}")
          PY

      - name: Restore exec bits
        run: |
          # upload-artifact loses exec bits; set them before zipping
          chmod +x Mac-Start.command Mac-Menu.command Mac-Diagnose.command Mac-Mobile.command
          chmod +x Linux-Start.sh Linux-Diagnose.sh Linux-Mobile.sh lib/maintain.sh lib/mobile.sh
          for bindir in app/runtime/node-mac-*/bin app/runtime/node-linux-*/bin; do
            [ -d "$bindir" ] && find "$bindir" -type f -exec chmod +x {} +
          done

      - name: Move scripts into system/ subdirectory
        run: |
          # End-user zip layout: only OpenClaw.app + OpenClaw.vbs at
          # root. Everything else (launcher scripts, menu/diagnose
          # helpers, lib/, .desktop, README) goes into system/ so the
          # root stays minimal for casual users.
          set -e
          mkdir -p system/lib
          # Launchers (Start)
          mv Mac-Start.command   system/
          mv Linux-Start.sh      system/
          mv Windows-Start.bat   system/
          # Menu + Diagnose
          mv Mac-Menu.command Mac-Diagnose.command   system/
          mv Linux-Menu.sh    Linux-Diagnose.sh      system/
          mv Windows-Menu.bat Windows-Diagnose.bat   system/
          # Mobile Connect launchers
          mv Mac-Mobile.command   system/
          mv Linux-Mobile.sh      system/
          mv Windows-Mobile.bat   system/
          # Linux desktop entry
          [ -f OpenClaw.desktop ] && mv OpenClaw.desktop system/
          # READMEs (users can find them in system/ if needed)
          [ -f README.md ] && mv README.md system/
          [ -f README.zh-CN.md ] && mv README.zh-CN.md system/
          # Helpers — move the whole lib/ tree instead of a hardcoded file
          # list. A fixed list silently leaves newly added helpers behind
          # (which then makes `rmdir lib` fail and kills the whole build),
          # e.g. lib/strip-provider-env.mjs broke the v2.0.0-beta.1 build.
          mv lib/* system/lib/
          rmdir lib
          echo "Root after move:"
          ls -1 | head -20

      - name: Create zip
        run: |
          set -e
          # We're currently cwd=$GITHUB_WORKSPACE; the dir name depends
          # on the repo name casing (Openclaw-portable) and isn't stable
          # across forks. Copy the tree into a fresh sibling dir named
          # OpenClawPortable/ (the name we want users to see after
          # unzip) and zip from there.
          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          STAGE="$WORK_PARENT/OpenClawPortable"
          rm -rf "$STAGE"
          # -a preserves exec bits set in the previous step
          cp -a "$GITHUB_WORKSPACE"/. "$STAGE"/
          # Don't ship the .git we removed earlier back via cp -a if
          # someone re-adds it; defensive remove inside the stage dir.
          rm -rf "$STAGE/.git" "$STAGE/.github"
          find "$STAGE" -name '.DS_Store' -delete
          cd "$WORK_PARENT"
          zip -yrq OpenClawPortable.zip OpenClawPortable/
          mv OpenClawPortable.zip "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE/OpenClawPortable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawPortable
          path: OpenClawPortable.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenClawPortable
          path: .

      - name: Show artifact
        run: ls -lh OpenClawPortable.zip

      - name: Compose release notes
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          {
            echo "## OpenClaw Portable $TAG"
            echo
            echo "便携版 AI 助手，解压即用，零安装，跨平台。"
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| [OpenClawPortable.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/OpenClawPortable.zip) | 全平台通用包 (macOS arm64/x64 + Linux x64/arm64 + Windows x64) |"
            echo
            echo "### 启动方式"
            echo
            echo "| 平台 | 操作 |"
            echo "|---|---|"
            echo "| macOS | 双击 \`OpenClaw.app\` |"
            echo "| Windows | 双击 \`OpenClaw.vbs\` |"
            echo "| Linux | \`bash system/Linux-Start.sh\` 或双击 \`system/OpenClaw.desktop\` |"
            echo
            echo "### 首次使用"
            echo
            echo "1. 解压到 U 盘或任意目录"
            echo "2. 双击启动器"
            echo "3. 浏览器打开配置中心 → 选模型 → 填 Key → 保存 → 打开聊天"
            echo
            echo "### macOS 权限问题"
            echo
            echo "首次双击如果提示无法打开："
            echo
            echo "\`\`\`bash"
            echo "cd ~/Downloads/OpenClawPortable"
            echo "xattr -cr . && chmod +x Mac-Start.command"
            echo "\`\`\`"
            echo
            echo "### SHA-256"
            echo
            echo "\`\`\`"
            sha256sum OpenClawPortable.zip 2>/dev/null || shasum -a 256 OpenClawPortable.zip
            echo "\`\`\`"
            echo
            echo "---"
            echo
            echo "基于 [OpenClaw](https://github.com/nicepkg/openclaw) · MIT License"
          } > release-notes.md
          cat release-notes.md

      - name: Determine pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qE "(alpha|beta|rc)"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cleanup duplicate drafts for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          echo "Looking for draft releases on tag: $TAG_NAME"
          DRAFT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG_NAME\") | .id")
          if [ -z "$DRAFT_IDS" ]; then
            echo "No duplicate drafts found."
          else
            for rid in $DRAFT_IDS; do
              echo "Deleting draft release id=$rid"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$rid"
            done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenClawPortable.zip
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          fail_on_unmatched_files: false
