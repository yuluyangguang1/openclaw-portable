name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Single job builds the universal zip containing ALL platform runtimes.
    # node_modules is pure JS (cross-platform), only the Node.js binary
    # differs per OS/arch. setup.sh --all-platforms downloads all of them.
    # We run on macOS (has tar + unzip + curl) which can fetch all platforms.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build universal package (all platforms)
        run: bash setup.sh --all-platforms

      - name: Verify runtimes
        run: |
          set -e
          echo "Checking all platform runtimes..."
          test -f app/runtime/node-mac-arm64/bin/node   || { echo "MISSING: node-mac-arm64"; exit 1; }
          test -f app/runtime/node-mac-x64/bin/node     || { echo "MISSING: node-mac-x64"; exit 1; }
          test -f app/runtime/node-linux-x64/bin/node   || { echo "MISSING: node-linux-x64"; exit 1; }
          test -f app/runtime/node-win-x64/node.exe     || { echo "MISSING: node-win-x64"; exit 1; }
          test -f app/core/node_modules/openclaw/openclaw.mjs || { echo "MISSING: openclaw.mjs"; exit 1; }
          echo "All runtimes present:"
          ls -d app/runtime/*/
          echo "OpenClaw installed OK"

      - name: Prepare portable folder
        run: |
          set -e
          # Remove dev/build artifacts that shouldn't ship
          rm -rf .git .github .gitignore
          # Keep setup.sh/setup.bat/setup.ps1 for users who want to rebuild
          echo "Portable folder ready"
          du -sh .
          du -sh app/runtime/*/

      - name: Restore exec bits
        run: |
          # upload-artifact loses exec bits; set them before zipping
          chmod +x Mac-Start.command Mac-Menu.command Mac-Install.command Mac-Diagnose.command
          chmod +x Linux-Start.sh Linux-Diagnose.sh setup.sh lib/maintain.sh
          for bindir in app/runtime/node-mac-*/bin app/runtime/node-linux-*/bin; do
            [ -d "$bindir" ] && find "$bindir" -type f -exec chmod +x {} +
          done

      - name: Create zip
        run: |
          cd ..
          mv openclaw-portable-work OpenClawPortable
          zip -yrq OpenClawPortable.zip OpenClawPortable/
          mv OpenClawPortable openclaw-portable-work
          mv OpenClawPortable.zip openclaw-portable-work/
          ls -lh openclaw-portable-work/OpenClawPortable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClawPortable
          path: OpenClawPortable.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenClawPortable
          path: .

      - name: Show artifact
        run: ls -lh OpenClawPortable.zip

      - name: Compose release notes
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          {
            echo "# OpenClaw Portable $TAG"
            echo
            echo "> 🦞 U-Claw 虾盘 — OpenClaw AI 助手离线安装 U 盘"
            echo "> 一个压缩包，任意平台解压即用 · 零安装 · 零痕迹"
            echo
            echo "## 下载 Download"
            echo
            echo "| 文件 | 说明 |"
            echo "|---|---|"
            echo "| [OpenClawPortable.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/OpenClawPortable.zip) | 全平台通用包 (macOS arm64/x64 + Linux x64/arm64 + Windows x64) |"
            echo
            echo "## 支持平台"
            echo
            echo "| 平台 | 启动方式 |"
            echo "|---|---|"
            echo "| macOS (Apple Silicon / Intel) | 双击 \`Mac-Start.command\` |"
            echo "| Linux (x86_64 / arm64) | \`bash Linux-Start.sh\` |"
            echo "| Windows 10/11 (x64) | 双击 \`Windows-Start.bat\` |"
            echo
            echo "## 首次使用"
            echo
            echo "1. 解压到 U 盘或任意目录"
            echo "2. 双击对应平台的启动器"
            echo "3. 浏览器自动打开配置面板 → 选模型 → 填 API Key → 开始用"
            echo
            echo "## macOS 首次双击提示「您没有权限」"
            echo
            echo "\`\`\`bash"
            echo "cd ~/Downloads/OpenClawPortable"
            echo "xattr -cr . && chmod +x Mac-Start.command"
            echo "\`\`\`"
            echo
            echo "## SHA-256"
            echo
            echo "\`\`\`"
            sha256sum OpenClawPortable.zip 2>/dev/null || shasum -a 256 OpenClawPortable.zip
            echo "\`\`\`"
            echo
            echo "---"
          } > release-notes.md
          cat release-notes.md

      - name: Determine pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qE "(alpha|beta|rc)"; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: OpenClawPortable.zip
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          fail_on_unmatched_files: false
